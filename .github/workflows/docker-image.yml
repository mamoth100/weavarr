# Builds the Weavarr image for arm64 (Raspberry Pi) and amd64 (regular PCs)
# and publishes it to GitHub Container Registry as
# ghcr.io/mamoth100/weavarr:latest on every push to main.
#
# Each platform builds on a native runner. The app depends on sharp, which
# ships compiled binaries, so building under emulation is both slow and prone
# to hanging (a multi-platform buildx run on the Pi sat for 30 minutes on
# npm ci at 0% CPU). The two images are then stitched into one multi-arch
# tag so `docker pull` picks the right one automatically.
name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two pushes in quick succession would otherwise race to publish "latest"
# and the older build could finish last. The newer run cancels the older.
concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Platform slug
        id: slug
        run: echo "value=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: GIT_SHA=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.slug.outputs.value }}
          cache-to: type=gha,mode=max,scope=${{ steps.slug.outputs.value }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.slug.outputs.value }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch tag
        working-directory: /tmp/digests
        run: |
          short="${GITHUB_SHA::7}"
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$short" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:latest"
