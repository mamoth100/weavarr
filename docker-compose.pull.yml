# Ready-to-run compose file for anyone using the published image. The
# install scripts (install.sh, install.ps1) download this file for you; by
# hand:
#
#   mkdir weavarr && cd weavarr
#   curl -fsSLo docker-compose.yml https://raw.githubusercontent.com/mamoth100/weavarr/main/docker-compose.pull.yml
#   docker compose up -d
#
# Then open http://<this machine>:6767 and fill in Settings. Everything you
# save lands in ./config/.env.local next to this file; the app restarts
# itself when you click Restart App.
#
# To update (the prune drops the image you just replaced; Docker otherwise
# keeps every old one, about 300 MB each):
#
#   cd weavarr && docker compose pull && docker compose up -d && docker image prune -f
#
# Service addresses: use the IP address of the machine each service runs
# on, even when it is this same machine (http://192.168.1.20:7878, not
# http://localhost:7878). Inside the container, localhost is the container.
#
# Needs Docker Compose v2.24 or newer (docker compose version).
name: weavarr

services:
  weavarr:
    image: ghcr.io/mamoth100/weavarr:latest
    container_name: weavarr
    restart: unless-stopped
    # Keep the container log to 50 MB (three files). Without a cap Docker
    # keeps every line forever; one container here reached 1.3 GB.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "6767:6767"
    # Lets http://host.docker.internal:<port> reach this machine as well, for
    # anyone who prefers that name to the IP address.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=6767
    env_file:
      - path: ./config/.env.local
        required: false
    volumes:
      - data:/app/data
      - ./config:/app/config

    # Linux only, optional: share the host's network instead, so
    # http://localhost:7878 style URLs work as they would on the host. Docker
    # Desktop for Windows and Mac ignores this and the app becomes
    # unreachable, which is why it is not the default. To use it, remove the
    # "ports" and "extra_hosts" sections above and uncomment the next line.
    # network_mode: host

volumes:
  data:
