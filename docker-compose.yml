# Explicit project name - without this, Compose defaults to the directory
# name, which would prefix every resource (volumes, network, labels) with
# whatever the checkout folder happens to be called.
name: weavarr

services:
  weavarr:
    # The image GitHub builds on every push to main. Building on the Pi
    # instead left a build cache that grew by hundreds of megabytes per
    # deploy; pulling takes seconds and leaves nothing behind. Deploy:
    #   cd /home/mamoth/weavarr && docker compose pull && docker compose up -d
    image: ghcr.io/mamoth100/weavarr:latest
    container_name: weavarr
    restart: unless-stopped
    # Keep the container log to 50 MB (three files). Without a cap Docker
    # keeps every line forever; one container here reached 1.3 GB.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # Radarr/Sonarr/Plex/etc URLs in the settings commonly point at
    # "localhost" (the same box). Host networking makes that resolve
    # correctly from inside the container too - default bridge networking
    # would isolate the container onto its own loopback, unable to reach
    # anything at the host's localhost. No port mapping needed/possible
    # with host networking - the app's own PORT below is what's exposed.
    network_mode: host
    environment:
      - PORT=6767
    # The settings file, injected as environment variables at container
    # start. Optional on purpose: a fresh install has no file yet, and the
    # app writes it on the first save from the Settings page. Restart the
    # container after saving for the new values to take effect.
    env_file:
      - path: ./config/.env.local
        required: false
    volumes:
      - data:/app/data
      # Settings live in ./config/.env.local on the host. A folder is
      # mounted (not the file itself) so that a missing file on first run
      # doesn't make Docker create a *directory* named .env.local in its
      # place. The container fixes the folder's ownership at start.
      - ./config:/app/config

volumes:
  data:
