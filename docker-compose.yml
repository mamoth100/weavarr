# Explicit project name - without this, Compose defaults to the directory
# name, which would prefix every resource (volumes, network, labels) with
# "docuview" if this checkout still lives in a folder called that.
name: weavarr

services:
  weavarr:
    build:
      context: .
      args:
        # Pass the checkout's commit so the image knows what it was built
        # from: GIT_SHA=$(git rev-parse --short HEAD) docker compose build
        GIT_SHA: ${GIT_SHA:-unknown}
    image: weavarr:local
    container_name: weavarr
    restart: unless-stopped
    # Radarr/Sonarr/Plex/etc URLs in .env.local commonly point at
    # "localhost" (the same box). Host networking makes that resolve
    # correctly from inside the container too - default bridge networking
    # would isolate the container onto its own loopback, unable to reach
    # anything at the host's localhost. No port mapping needed/possible
    # with host networking - the app's own PORT below is what's exposed.
    network_mode: host
    environment:
      - PORT=6767
    env_file:
      - .env.local
    volumes:
      - data:/app/data
      # env_file above only injects the VALUES as environment variables at
      # container start - it never copies the actual file in. The Settings
      # page reads/writes .env.local as a real file (lib/settings.ts), so
      # without this bind mount it'd read an empty file (showing everything
      # as "not configured" despite env vars working fine) and any save
      # from the UI would write to a path that doesn't survive a rebuild.
      # This makes it the literal same file the host has.
      - ./.env.local:/app/.env.local

volumes:
  data:
